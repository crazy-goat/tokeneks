version: "2"
linters:
  default: standard
  settings:
    errcheck:
      # Best-effort cleanup and response-writing calls whose errors carry no useful information.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*encoding/json.Encoder).Encode
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*tokeneks/ingest.Watcher).Close
        - (*tokeneks/store.Store).Close
        - os.Remove
formatters:
  enable:
    - gofmt
    - goimports
